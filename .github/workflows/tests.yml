name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Neutralité (règles génériques ; les termes d'un projet se vérifient dans son dépôt privé)
        run: python3 -I outils/neutralite.py
      - name: Version du plugin (elle monte avec ce qu'il livre)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then REF=origin/${{ github.base_ref }}; else REF=${{ github.event.before }}; fi
          if git cat-file -e "$REF^{commit}" 2>/dev/null; then python3 -I outils/version.py "$REF"; else echo "pas de révision de comparaison"; fi
      - name: Tests
        run: |
          set -e
          for f in labo/guichet/tests/test_*.py labo/tests/test_*.py outils/tests/test_*.py hooks/tests/test_*.py; do
            echo "== $f"
            python3 -I "$f"
          done
