name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Neutralité (règles génériques ; les termes d'un projet se vérifient dans son dépôt privé)
        run: python3 -I outils/neutralite.py
      - name: Tests
        run: |
          set -e
          for f in labo/guichet/tests/test_*.py labo/tests/test_*.py outils/tests/test_*.py; do
            echo "== $f"
            python3 -I "$f"
          done
